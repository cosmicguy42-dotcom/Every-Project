[package]
name = "ouija"
version = "0.1.0"
edition = "2021"
authors = ["Ouija Security Core <ouija@security.local>"]
description = "High-Security Ephemeral Onion Messaging Engine (Rust + C + x86_64 ASM + Python Tor)"

[dependencies]
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
hex = "0.4"
base64 = "0.22"
chrono = "0.4"

[build-dependencies]
cc = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
